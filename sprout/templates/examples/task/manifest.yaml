name: task
description: Create a task folder and note

inputs:
  - name: name
    type: string
    description: Task slug

  - name: type
    type: enum
    enum:
      - bug
      - feat
      - refactor
    default: feat
    description: Task category

assets:
  - type: dir
    path: tasks/{{YY}}-{{MM}}-{{DD}}_{{name}}
    ref: task_dir

  - type: file
    path: "{{assets.task_dir.rel_path}}/task.md"
    template: task.md
