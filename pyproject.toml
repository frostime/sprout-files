[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sprout-cli"
version = "0.2.0"
description = "Template-driven file and directory generator for project workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sprout" }]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
sprout = "sprout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sprout"]
